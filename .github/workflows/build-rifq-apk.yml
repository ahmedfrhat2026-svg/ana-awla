name: Build RIFQ APK

on:
  push:
    branches: [main, master, "claude/rifq-brain-rot-app-5d8ilt"]
    paths: ["rifq/**", ".github/workflows/build-rifq-apk.yml"]
    tags: ["rifq-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rifq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org=com.frhat --project-name=rifq .
          # الـ overlay يحتوي AndroidManifest المعدّل + build.gradle.kts
          # (minSdk 23 + core library desugaring المطلوب لـ flutter_local_notifications)
          cp -r android_overlay/app/. android/app/

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK (سريع التثبيت للتجربة)
        run: flutter build apk --debug

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-debug.apk ../out/rifq-debug.apk
          cp build/app/outputs/flutter-apk/app-*-release.apk ../out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: rifq-apk
          path: out/*.apk
          retention-days: 90

      # Release عام بروابط تحميل مباشرة — الـ action ينشئ الـ tag بنفسه
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rifq-v0.3.0
          name: "رِفْق v0.3.0"
          files: out/*.apk
          body: |
            رِفْق v0.3.0 — ارجع لنفسك على مهل 🌿

            الجديد: رقم النسخة ظاهر + شاشة «ما الجديد»، فويس نوت في حصاد اليوم
            وبعد المذاكرة، مراقبة وقت إنستجرام (بإذنك) مع حد يومي وتنبيه لطيف،
            وخط Cairo أوضح وأجرأ في العناوين.

            **للتثبيت على أندرويد:** نزّل `app-arm64-v8a-release.apk` (أغلب الموبايلات الحديثة).
            لو موبايلك قديم جرّب `app-armeabi-v7a-release.apk`، ولو حصلت مشكلة استخدم `rifq-debug.apk`.
