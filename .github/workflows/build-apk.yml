name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'
          cache: true

      - name: Show Flutter info
        run: flutter --version

      - name: Scaffold platform folders
        run: |
          flutter create --platforms=android --org=com.frhat --project-name=ana_awla .

      - name: Apply Android manifest overlay
        run: |
          cp android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Bump minSdkVersion to 23 (flutter_local_notifications requirement)
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdkVersion = 23/' android/app/build.gradle || true
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle || true
            sed -i 's/minSdkVersion[[:space:]]\+flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          fi

      - name: Enable Android core library desugaring (for flutter_local_notifications + timezone)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            F=android/app/build.gradle.kts
            sed -i 's|compileOptions {|compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' "$F"
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"
            echo "=== Patched $F ==="
            cat "$F"
          elif [ -f android/app/build.gradle ]; then
            F=android/app/build.gradle
            sed -i 's|compileOptions {|compileOptions {\n        coreLibraryDesugaringEnabled true|' "$F"
            printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> "$F"
            echo "=== Patched $F ==="
            cat "$F"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Run parser tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/ana-awla-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ana-awla-apk
          path: output/*.apk
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
