name: rifq
description: "رِفْق — ارجع لنفسك على مهل. رفيق هادئ للهدوء والمذاكرة وتوثيق الإنجازات الصغيرة."
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  intl: ^0.20.2
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# توليد أيقونة التطبيق — يُشغَّل في CI بعد flutter create:
# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FAF6EE"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
